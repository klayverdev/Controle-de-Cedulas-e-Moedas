<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contador de Caixa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header__brand">
        <div>
          <p class="app-header__title">Contador de Caixa</p>
          <p class="app-header__subtitle">Controle de cédulas, moedas e movimentações</p>
        </div>
      </div>
    </header>

    <main class="layout">
      <div class="panels">
        <section class="panel" aria-labelledby="denominations-title">
          <h2 id="denominations-title" class="panel__title">Cédulas e moedas</h2>

          <div id="main-inputs" class="denominations"></div>

          <button type="button" class="btn btn-outline btn-block" data-action="open-import">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3v12"></path>
              <path d="M7 10l5 5 5-5"></path>
              <path d="M4 19h16"></path>
            </svg>
            Importar contagem
          </button>

          <div class="actions">
            <button type="button" class="btn btn-success" data-action="record" data-direction="1">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19V5"></path>
                <path d="M6 11l6-6 6 6"></path>
              </svg>
              Salvar entrada
            </button>
            <button type="button" class="btn btn-danger" data-action="record" data-direction="-1">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 5v14"></path>
                <path d="M18 13l-6 6-6-6"></path>
              </svg>
              Salvar retirada
            </button>
          </div>
        </section>

        <section class="panel" aria-labelledby="history-title">
          <div class="panel__title-row">
            <h2 id="history-title" class="panel__title">Histórico de operações</h2>
            <button
              type="button"
              class="btn btn-icon"
              data-action="show-deleted"
              aria-label="Ver operações apagadas"
              title="Ver operações apagadas"
            >
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 6h18"></path>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                <path d="M10 11v6"></path>
                <path d="M14 11v6"></path>
              </svg>
            </button>
          </div>
          <div id="log" class="history"></div>
        </section>
      </div>

      <footer class="summary">
        <p class="summary__totals">
          Notas <span id="total-notas">R$ 0.00</span>
          <span class="summary__dot" aria-hidden="true"></span>
          Moedas <span id="total-moedas">R$ 0.00</span>
        </p>
        <div class="summary__grand">
          <span class="summary__grand-label">Total em caixa</span>
          <span class="summary__grand-value">R$ <span id="total-geral">0.00</span></span>
          <button
            type="button"
            class="btn btn-icon"
            data-action="show-balance"
            aria-label="Ver detalhamento do saldo atual"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
      </footer>
    </main>
  </div>

  <div id="modal" class="modal">
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title" class="modal__title">Detalhes</h3>

      <div id="modal-body" class="modal__body"></div>

      <div id="import-field" class="modal__field" hidden>
        <label class="field-label" for="import-type">Tipo de operação</label>
        <select id="import-type" class="select">
          <option value="1">Entrada (+)</option>
          <option value="-1">Retirada (-)</option>
        </select>

        <label class="field-label" for="import-text">Contagem</label>
        <textarea
          id="import-text"
          class="textarea"
          placeholder="Cole a contagem aqui... (ex: 3x R$ 50.00)"
        ></textarea>

        <button type="button" class="btn btn-primary btn-block" data-action="process-import">
          Processar importação
        </button>
      </div>

      <div id="deleted-field" class="modal__field" hidden>
        <div id="deleted-list" class="deleted-list"></div>
      </div>

      <div id="delete-area" class="modal__field" hidden>
        <button type="button" class="btn btn-danger btn-block" data-action="delete-history-entry">
          Excluir operação
        </button>
      </div>

      <div id="copy-area" class="modal__field" hidden>
        <button type="button" class="btn btn-outline btn-block" data-action="copy-balance">
          Copiar contagem
        </button>
      </div>

      <button type="button" class="btn btn-ghost btn-block" data-action="close-modal">
        Fechar
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
